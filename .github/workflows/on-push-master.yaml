name: On Push Master

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'on-push-master'
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - name: Install dependencies
        run: pnpm install
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      OCPP_BASE_URL: ws://localhost:2600/e-flux
      APP_URL: https://chargestation.one
      ENV_NAME: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
      - name: Install dependencies
        run: pnpm install
      - name: Create build
        run: pnpm run build
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

  deploy-pages:
    name: Deploy to GitHub pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
